name: Source Package Release
run-name: Source Package Release${{ !(startsWith(github.ref, 'refs/tags/') || inputs.release_tag != '') && ' (build only)' || '' }}

# Builds the trimmed C++ source package (opencc profile: includes the Jieba
# segmentation plugin but excludes Node.js, Python, documentation, or packaging
# files) and attaches it to the release. The trimmed package keeps both build
# systems working, so it is smoke-tested with CMake and Bazel before upload.
# Like the other release workflows it uploads to the draft created by
# release-draft.yml; publishing is manual.

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing release tag to upload the source package to, for example ver.1.4.1. Leave empty to only build the artifact."
        required: false
        type: string
  push:
    tags:
      - "ver.*"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-source-package:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build build-essential

      - uses: bazel-contrib/setup-bazel@0.19.0
        with:
          bazelisk-cache: true
          repository-cache: true

      - name: Build trimmed source package
        run: |
          cmake -S . -B build-src \
            -DOPENCC_SOURCE_PACKAGE_PROFILE=opencc \
            -DCPACK_SOURCE_ARCHIVE_TIMESTAMP=0
          (cd build-src && cpack --config CPackSourceConfig.cmake -G TGZ)
          # Repack for reproducibility: normalize ownership (root:root),
          # timestamps (epoch 0), and file order (sorted).
          cpack_tarball=$(ls build-src/opencc-*-opencc-src.tar.gz)
          base=$(basename "$cpack_tarball" .tar.gz)
          tmpdir=$(mktemp -d)
          tar xzf "$cpack_tarball" -C "$tmpdir"
          mkdir -p dist
          tar cf - -C "$tmpdir" --sort=name --owner=root --group=root --mtime=@0 "$base" | gzip -9n > "dist/${base}.tar.gz"
          tar cf - -C "$tmpdir" --sort=name --owner=root --group=root --mtime=@0 "$base" | xz -9 > "dist/${base}.tar.xz"
          rm -rf "$tmpdir"
          ls -l dist/

      - name: Smoke-test the package (CMake and Bazel)
        run: |
          set -e
          tarball=$(ls dist/opencc-*-opencc-src.tar.gz)
          workdir=$(mktemp -d)
          tar xzf "$tarball" -C "$workdir"
          src=$(echo "$workdir"/opencc-*-opencc-src)
          # CMake: configure and build the core library, CLI tools, and Jieba plugin.
          cmake -S "$src" -B "$src/build" -DCMAKE_BUILD_TYPE=Release -DBUILD_OPENCC_JIEBA_PLUGIN=ON
          cmake --build "$src/build" --target opencc opencc_dict opencc-jieba --parallel
          # Bazel: build the core and Jieba plugin targets. Catches a trimmed
          # package that dropped a file the Bazel module or BUILD graph needs.
          (cd "$src" && bazel build //src/tools:dict_converter //data/dictionary:binary_dictionaries //plugins/jieba:opencc-jieba)

      - uses: actions/upload-artifact@v4
        with:
          name: opencc-source-package
          path: dist/opencc-*-opencc-src.tar.*

      - name: Upload to GitHub release
        if: startsWith(github.ref, 'refs/tags/') || inputs.release_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ inputs.release_tag || github.ref_name }}"
          for i in $(seq 1 30); do
            gh release view "$tag" --json isDraft > /dev/null 2>&1 && break
            echo "Waiting for release $tag to be created ($i/30)..."
            sleep 10
          done
          gh release upload "$tag" \
            dist/opencc-*-opencc-src.tar.gz \
            dist/opencc-*-opencc-src.tar.xz \
            --clobber
